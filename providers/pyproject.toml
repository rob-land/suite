[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "suite-providers"
version = "0.2.0"
description = "Shared media-backend abstraction for the suite (zoetrope / couch / hearth): stereo-aware models, Watch Next semantics, provider interfaces"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
network = ["httpx>=0.27"]
# Grayjay plugin support. quickjs (not V8) because the plugin API is
# synchronous and quickjs is the Python engine that lets JS call back
# into Python inside one call stack.
grayjay = ["httpx>=0.27", "quickjs>=1.19"]
# Opt-in V8 engine (engine="v8"). Parses plugins QuickJS can't, but the
# current wheel has an ICU-init defect — see grayjay/engines.py.
grayjay-v8 = ["httpx>=0.27", "quickjs>=1.19", "stpyv8>=13"]

[tool.setuptools.packages.find]
include = ["suite_providers*"]

# The JS runtime and the Node sidecar are data, not modules — without
# this they are missing from any wheel/site-packages install and the
# Grayjay host fails at import time.
[tool.setuptools.package-data]
suite_providers = [
    "grayjay/prelude.js",
    "grayjay/sidecar/*.mjs",
    "grayjay/sidecar/package.json",
]
